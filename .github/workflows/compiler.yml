name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.suite }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: checks, shard: ''}
          - {suite: tests, shard: '1/3'}
          - {suite: tests, shard: '2/3'}
          - {suite: tests, shard: '3/3'}
          - {suite: reference, shard: '1/3'}
          - {suite: reference, shard: '2/3'}
          - {suite: reference, shard: '3/3'}
          - {suite: sanitizers, shard: ''}
          - {suite: public, shard: ''}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSK_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verify.txt
      - run: python -m pip install -r requirements-verify.txt
      - uses: actions/cache@v4
        if: matrix.suite == 'public'
        with:
          path: |
            .verify-helper/cache
            ~/.cache/online-judge-tools/library-checker-problems
          key: public-judge-${{ runner.os }}-${{ hashFiles('requirements-verify.txt', 'examples/aoj/**', 'examples/library_checker/**') }}
          restore-keys: public-judge-${{ runner.os }}-
      - run: python3 -m unittest discover -s tests -p test_test_runner.py
        if: matrix.suite == 'checks'
      - run: python3 tools/test.py --suite ${{ matrix.suite }}
